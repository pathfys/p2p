<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<meta name="description" content="P2P Light — AI-терминал P2P-стаканов криптобирж: агрегация, фильтрация, анализ контекста сделки и закупки USDT.">
<title>P2P Light — AI P2P Terminal</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7a600'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-size='15' font-weight='bold' text-anchor='middle' fill='%23000000'%3EP2%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/components.css">
<link rel="stylesheet" href="./styles/screens.css">
<link rel="stylesheet" href="./styles/splash.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>


<!-- Загрузочный экран: рисуется сразу, до инициализации приложения -->
<div id="splash" role="status" aria-label="Загрузка P2P Light">
  <div class="sp-stage">
    <div class="sp-wallet-glow" aria-hidden="true"></div>
    <img class="sp-wallet" src="./assets/splash/wallet.webp" alt="" aria-hidden="true">

    <img class="sp-card left"  src="./assets/splash/card-white.webp" alt="" aria-hidden="true">
    <img class="sp-card right" src="./assets/splash/cards-dark.webp" alt="" aria-hidden="true">

    <div class="sp-word">
      <div class="sp-p2p">
        <span style="--i:0">P</span><span style="--i:1" class="accent">2</span><span style="--i:2">P</span>
      </div>
      <div class="sp-light">Light</div>
    </div>
  </div>

  <div class="sp-foot">
    <div class="sp-bar"><i id="sp-progress"></i></div>
    <div class="sp-hint" id="sp-hint">инициализация…</div>
  </div>
  <div class="sp-brand">P2P Light · агрегатор стаканов</div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">P2</div>
      <div>
        <div class="brand-name display" id="screen-title">P2P LIGHT</div>
        <div class="brand-sub" id="screen-sub">ai p2p terminal</div>
      </div>
    </div>
    <div id="topbar-slot" style="display:flex;align-items:center;gap:8px"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Основная навигация"></nav>
</div>

<div id="toasts" aria-live="assertive"></div>
<div id="layers"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
